name: Bug Report
description: Report a defect, error, or unexpected behavior in session-tracker
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below to help us investigate and resolve it.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Which AI coding assistant are you using session-tracker with?
      options:
        - Claude Code
        - OpenCode
        - Google Antigravity (AGY)
        - Other / Standalone
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      description: e.g. macOS 15.2, Ubuntu 24.04, WSL2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the issue.
      placeholder: |
        1. Start session with ...
        2. Run command ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or Diagnostics (Optional)
      description: Output from session-query status or relevant lines from ~/.session-tracker/solidtime-sync.log (ensure no secrets are included).
      render: shell
